<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fihhguard</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-container">
      <header class="header">
        <div class="header-title">
          <span class="header-icon" aria-hidden="true"
            ><svg width="28" height="28" viewBox="0 0 64 64" fill="none">
              <path
                d="M44 32 60 20q-2 12 0 24Z"
                fill="var(--accent)"
                stroke="currentColor"
                stroke-width="2"
              />
              <ellipse
                cx="28"
                cy="32"
                rx="19"
                ry="14"
                fill="var(--accent)"
                stroke="currentColor"
                stroke-width="2"
              />
              <path
                d="M26 38q4 10 12 6-4-4-6-8Z"
                fill="var(--accent)"
                stroke="currentColor"
                stroke-width="2"
              />
              <circle cx="17" cy="29" r="3" fill="currentColor" />
              <circle cx="16" cy="28" r="1" fill="var(--paper)" />
              <path
                d="M10 36q3 2 6 0"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              /></svg
          ></span>
          <span class="header-name">fihhguard</span>
        </div>
        <div class="status-row">
          <span class="status-dot" id="status-dot"></span>
          <span class="status-text" id="status-text">Checking backend…</span>
        </div>
      </header>

      <div class="checker-section">
        <p class="eyebrow">manual check</p>
        <label class="input-label" for="url-input"
          >drop a link. fihh will sniff it.</label
        >
        <div class="input-row">
          <input
            type="url"
            id="url-input"
            class="url-input"
            placeholder="https://example.com"
            autocomplete="off"
            spellcheck="false"
          />
          <button class="check-btn" id="check-btn">scan it</button>
        </div>
        <p class="input-hint">Must start with http:// or https://</p>
      </div>

      <div id="result-area" class="result-area" style="display: none"></div>

      <!-- Loading -->
      <div id="loading" class="loading" style="display: none">
        <div class="spinner"></div>
        <span>sniffing around the page...</span>
      </div>

      <!-- Error -->
      <div id="error-area" class="error-area" style="display: none"></div>

      <footer class="footer">
        <button id="allow-link" class="footer-link" type="button">
          allow this site
        </button>
        <a href="#" id="settings-link" class="footer-link">settings →</a>
      </footer>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
